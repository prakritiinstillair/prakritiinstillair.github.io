<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Browser Kaoss Pad</title>
  <style>
    body {
      background: #121212;
      color: #00ffcc;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
      user-select: none;
    }
    .top-controls { margin-bottom: 15px; }
    
    /* カオスパッドのタッチ領域 */
    #pad {
      width: 320px;
      height: 320px;
      background: #1a1a1a;
      border: 2px solid #00ffcc;
      box-shadow: 0 0 15px rgba(0,255,204,0.2);
      position: relative;
      cursor: crosshair;
      touch-action: none; /* スマホ操作時のスクロール防止 */
    }
    
    /* 指のポインタ（カーソル） */
    #pointer {
      width: 20px;
      height: 20px;
      background: #ff0055;
      border-radius: 50%;
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
      box-shadow: 0 0 10px #ff0055;
    }

    .bottom-controls {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
  </style>
</head>
<body>

  <!-- 上部: ファイル読み込み & 再生 -->
  <div class="top-controls">
    <input type="file" id="audioFile" accept=".mp3,.wav,.m4a,audio/*"
    <button id="playBtn">PLAY / STOP</button>
  </div>

  <!-- 中央: カオスパッド領域 -->
  <div id="pad">
    <div id="pointer"></div>
  </div>

  <!-- 下部: ピッチ & 再生速度 -->
  <div class="bottom-controls">
    <label for="speed">SPEED / PITCH: <span id="speedVal">1.0</span>x</label>
    <input type="range" id="speed" min="0.2" max="2.0" step="0.01" value="1.0">
  </div>

<script>
let audioCtx;
let sourceNode;
let audioBuffer;
let isPlaying = false;

// エフェクトノード群
let filterNode;
let distortionNode;
let delayNode;
let feedbackGain;

const pad = document.getElementById('pad');
const pointer = document.getElementById('pointer');
const playBtn = document.getElementById('playBtn');
const audioFileInput = document.getElementById('audioFile');
const speedSlider = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');

// --- 1. MP3ファイルのロード ---
audioFileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  const arrayBuffer = await file.arrayBuffer();
  audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
  alert('ファイル読み込み完了！');
});

// --- 2. ディストーションの波形カーブ生成 ---
function makeDistortionCurve(amount) {
  const k = typeof amount === 'number' ? amount : 50;
  const n_samples = 44100;
  const curve = new Float32Array(n_samples);
  const deg = Math.PI / 180;
  for (let i = 0; i < n_samples; ++i) {
    const x = (i * 2) / n_samples - 1;
    curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
  }
  return curve;
}

// --- 3. 再生／停止ルーチン ---
playBtn.addEventListener('click', () => {
  if (!audioBuffer) return alert('MP3ファイルを選択してください');

  if (isPlaying) {
    sourceNode.stop();
    isPlaying = false;
    return;
  }

  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  // ノード作成 & 接続
  sourceNode = audioCtx.createBufferSource();
  sourceNode.buffer = audioBuffer;
  sourceNode.loop = true;
  sourceNode.playbackRate.value = parseFloat(speedSlider.value);

  filterNode = audioCtx.createBiquadFilter();
  distortionNode = audioCtx.createWaveShaper();
  delayNode = audioCtx.createDelay();
  feedbackGain = audioCtx.createGain();

  // 初期値設定
  filterNode.type = 'lowpass';
  filterNode.frequency.value = 20000;
  distortionNode.curve = null; // ノーマル
  delayNode.delayTime.value = 0;
  feedbackGain.gain.value = 0.3; // ディレイの戻り

  // 接続: Source -> Filter -> Distortion -> Delay & Destination
  sourceNode.connect(filterNode);
  filterNode.connect(distortionNode);
  distortionNode.connect(delayNode);
  
  // ディレイフィードバックループ
  delayNode.connect(feedbackGain);
  feedbackGain.connect(delayNode);

  // 出力へ
  distortionNode.connect(audioCtx.destination);
  delayNode.connect(audioCtx.destination);

  sourceNode.start(0);
  isPlaying = true;
});

// --- 4. スライダー操作（Speed / Pitch） ---
speedSlider.addEventListener('input', (e) => {
  const val = parseFloat(e.target.value);
  speedVal.textContent = val.toFixed(2);
  if (sourceNode) {
    sourceNode.playbackRate.value = val;
  }
});

// --- 5. Padのポインター操作（XYエフェクト処理） ---
function updateEffects(x, y) {
  // x, y は 0.0 〜 1.0 に正規化
  
  // 【X軸: フィルター】
  // 左半分(0.0 - 0.5): Lowpass (20Hz ~ 20,000Hz)
  // 右半分(0.5 - 1.0): Highpass (20Hz ~ 10,000Hz)
  if (x < 0.5) {
    filterNode.type = 'lowpass';
    // 指を左端に持っていくほど削れる
    const freq = Math.pow(x * 2, 2) * 19980 + 20; 
    filterNode.frequency.setValueAtTime(freq, audioCtx.currentTime);
  } else {
    filterNode.type = 'highpass';
    // 指を右端に持っていくほど高域だけ残る
    const freq = Math.pow((x - 0.5) * 2, 2) * 10000 + 20;
    filterNode.frequency.setValueAtTime(freq, audioCtx.currentTime);
  }

  // 【Y軸: 上=ディストーション、下=ディレイ】
  // Y軸は上が0、下が1（ブラウザ座標系）
  if (y < 0.5) {
    // 上半分：ディストーション（上に行くほど強く）
    const distAmount = (0.5 - y) * 2 * 400; // 0 ~ 200
    distortionNode.curve = makeDistortionCurve(distAmount);
    delayNode.delayTime.setValueAtTime(0, audioCtx.currentTime);
  } else {
    // 下半分：簡易ディレイ（下に行くほど遅延時間を長く）
    distortionNode.curve = null;
    const delayTime = (y - 0.5) * 2 * 0.5; // 0.0s ~ 0.5s
    delayNode.delayTime.setValueAtTime(delayTime, audioCtx.currentTime);
  }
}

// マウス＆タッチイベントのハンドリング
function handlePointer(e) {
  if (!isPlaying) return;
  
  const rect = pad.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;

  let x = (clientX - rect.left) / rect.width;
  let y = (clientY - rect.top) / rect.height;

  // 0~1の範囲にクランプ
  x = Math.max(0, Math.min(1, x));
  y = Math.max(0, Math.min(1, y));

  // ポインター描画
  pointer.style.display = 'block';
  pointer.style.left = `${x * 100}%`;
  pointer.style.top = `${y * 100}%`;

  updateEffects(x, y);
}

// イベント登録
pad.addEventListener('pointerdown', (e) => {
  pad.setPointerCapture(e.pointerId);
  handlePointer(e);
});
pad.addEventListener('pointermove', (e) => {
  if (e.buttons > 0 || e.touches) handlePointer(e);
});
pad.addEventListener('pointerup', () => {
  // 指を離したらエフェクトをスルー状態（原音）に戻す調整もここで可能
});
</script>
</body>
</html>
